# Runs on every push and pull request: type checks, unit tests, the rules simulator, a syntax
# check of firestore.rules, the same security scenarios on the official Firestore emulator, and a
# production build. Nothing here deploys.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:rules
      - name: Security rules on the Firestore emulator
        run: npm run test:rules
      - run: npm run build
